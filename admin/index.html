.sw span{position:absolute;inset:0;background:#cbd5e1;transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;background:#fff;transition:.2s}
.sw input:checked+span{background:#3AA845}.sw input:checked+span::after{transform:translateX(20px)}

.bn.on{color:#1D5BA5}

.vue{animation:ap .28s ease both}
@keyframes ap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.feuille{animation:mont .28s ease both}

.grid>*{min-width:0}
.justif{text-align:justify;hyphens:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function majBlocs(){const c=$('#blocs');if(!c)return;const B=cur.blocs;const T={paragraphe:'Paragraphe',intertitre:'Intertitre',citation:'Citation'};
 c.innerHTML=B.map((b,i)=>`<div class="border border-trait ${b.type==='intertitre'?'border-l-4 border-l-brand':b.type==='citation'?'border-l-4 border-l-leaf bg-leaf-light/40':''} p-3"><div class="flex items-center justify-between mb-2"><span class="text-[11px] font-bold uppercase tracking-wide text-slate-500">${T[b.type]}</span>${cur.ro?'':`<span class="flex"><button type="button" data-a="blocMove" data-i="${i}" data-d="-1" class="w-9 h-9 flex items-center justify-center text-slate-500 disabled:opacity-30" ${i===0?'disabled':''} aria-label="Monter">${ic('haut','w-4 h-4')}</button><button type="button" data-a="blocMove" data-i="${i}" data-d="1" class="w-9 h-9 flex items-center justify-center text-slate-500 disabled:opacity-30" ${i===B.length-1?'disabled':''} aria-label="Descendre">${ic('bas','w-4 h-4')}</button><button type="button" data-a="blocDel" data-i="${i}" class="w-9 h-9 flex items-center justify-center text-red-600" aria-label="Supprimer">${ic('trash','w-4 h-4')}</button></span>`}</div><textarea data-bloc="${i}" class="champ ${b.type==='intertitre'?'!min-h-[56px] font-semibold':''}" ${cur.ro?'disabled':''} style="min-height:${b.type==='paragraphe'?110:70}px">${esc(b.texte)}</textarea></div>`).join('')}

/* =====================================================================
   MOTEUR D'ÉDITION GÉNÉRIQUE (champs, listes répétables, images)
   ===================================================================== */
const idp=s=>String(s).replace(/\W/g,'_');
const provisoire=v=>!v||v==='#'||/123 45 67|061234567|contact@btp-congo/.test(String(v));
const clone=o=>JSON.parse(JSON.stringify(o));
function defVal(f){if(f.t==='liste')return (f.d||[]).map(it=>({...valeursDefaut(f.champs),...it}));if(f.t==='lien')return {...f.d};return f.d}
function valeursDefaut(champs){const o={};champs.forEach(f=>{if(!f.g)o[f.k]=defVal(f)});return o}

function champ(f,v,ro,pre=''){
 const nm=pre+f.k,id='f_'+idp(nm),d=ro?'disabled':'',val=v??'',req=f.req?' required':'',sp=f.span==2?'md:col-span-2':'';
 const prov=f.todo&&provisoire(val);
 const lab=`<label class="lbl" for="${id}">${f.l}${f.req?' <span class="text-red-600">*</span>':''}${prov?' <span class="puce bg-amber-100 text-amber-800 ml-1">À compléter</span>':''}${f.sa?` <span class="puce bg-slate-200 text-slate-600 ml-1">${ic('cadenas','w-3 h-3')}Super admin</span>`:''}</label>`;
 const aide=f.aide?`<p class="text-[11px] text-slate-500 mt-1">${f.aide}</p>`:'';
 let c;
 if(f.t==='liste')return `<div class="md:col-span-2"><p class="text-sm font-semibold text-brand-dark mb-2">${f.l}</p>${listeHtml(f,v||[],ro)}</div>`;
 if(f.t==='lien')return `<div class="md:col-span-2"><p class="lbl">${f.l}</p><div class="grid sm:grid-cols-2 gap-2"><input class="champ" name="${nm}__l" placeholder="Libellé du bouton" value="${esc((val||{}).l)}" ${d}><input class="champ" name="${nm}__u" placeholder="Adresse (/page, #ancre ou https://…)" value="${esc((val||{}).u)}" ${d}></div></div>`;
 if(f.t==='switch')return `<div class="flex items-center justify-between gap-4 py-2 md:col-span-2"><div><p class="text-sm font-semibold text-brand-dark">${f.l}</p>${f.aide?`<p class="text-xs text-slate-500">${f.aide}</p>`:''}</div>${interrupteur(nm,val,ro||(f.sa&&S.role!=='superadmin'))}</div>`;
 if(f.t==='textarea')c=`<textarea class="champ" id="${id}" name="${nm}" ${d}${req} style="min-height:${(f.rows||4)*24}px">${esc(val)}</textarea>`;
 else if(f.t==='select'){const ops=typeof f.opts==='function'?f.opts():f.opts;c=`<select class="champ" id="${id}" name="${nm}" ${d}>${ops.map(o=>{const[ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${ov==val?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`}
 else if(f.t==='image')c=`<div class="flex flex-col min-[480px]:flex-row gap-3 items-start"><div data-apercu="${id}" class="w-full max-w-[240px] min-[480px]:w-44 aspect-[4/3] shrink-0 border border-dashed border-[#9db4d3] bg-brand-light bg-cover bg-center flex items-center justify-center text-brand/60" style="${val?`background-image:url('${esc(src(val))}');border-style:solid`:''}">${val?'':ic('image','w-8 h-8')}</div><div class="mi
