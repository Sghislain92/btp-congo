.sw span{position:absolute;inset:0;background:#cbd5e1;transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;background:#fff;transition:.2s}

.justif{text-align:justify;hyphens:auto}

const idp=s=>String(s).replace(/\W/g,'_');

function defVal(f){if(f.t==='liste')return (f.d||[]).map(it=>({...valeursDefaut(f.champs),...it}));if(f.t==='lien')return {...f.d};return f.d}
function valeursDefaut(champs){const o={};champs.forEach(f=>{if(!f.g)o[f.k]=defVal(f)});return o}

function champ(f,v,ro,pre=''){
 const nm=pre+f.k,id='f_'+idp(nm),d=ro?'disabled':'',val=v??'',req=f.req?' required':'',sp=f.span==2?'md:col-span-2':'';
 const prov=f.todo&&provisoire(val);
 const lab=`<label class="lbl" for="${id}">${f.l}${f.req?' <span class="text-red-600">*</span>':''}${prov?' <span class="puce bg-amber-100 text-amber-800 ml-1">À compléter</span>':''}${f.sa?` <span class="puce bg-slate-200 text-slate-600 ml-1">${ic('cadenas','w-3 h-3')}Super admin</span>`:''}</label>`;
 const aide=f.aide?`<p class="text-[11px] text-slate-500 mt-1">${f.aide}</p>`:'';
 let c;
 if(f.t==='liste')return `<div class="md:col-span-2"><p class="text-sm font-semibold text-brand-dark mb-2">${f.l}</p>${listeHtml(f,v||[],ro)}</div>`;
 if(f.t==='lien')return `<div class="md:col-span-2"><p class="lbl">${f.l}</p><div class="grid sm:grid-cols-2 gap-2"><input class="champ" name="${nm}__l" placeholder="Libellé du bouton" value="${esc((val||{}).l)}" ${d}><input class="champ" name="${nm}__u" placeholder="Adresse (/page, #ancre ou https://…)" value="${esc((val||{}).u)}" ${d}></div></div>`;
 if(f.t==='switch')return `<div class="flex items-center justify-between gap-4 py-2 md:col-span-2"><div><p class="text-sm font-semibold text-brand-dark">${f.l}</p>${f.aide?`<p class="text-xs text-slate-500">${f.aide}</p>`:''}</div>${interrupteur(nm,val,ro||(f.sa&&S.role!=='superadmin'))}</div>`;
 if(f.t==='textarea')c=`<textarea class="champ" id="${id}" name="${nm}" ${d}${req} style="min-height:${(f.rows||4)*24}px">${esc(val)}</textarea>`;
 else if(f.t==='select'){const ops=typeof f.opts==='function'?f.opts():f.opts;c=`<select class="champ" id="${id}" name="${nm}" ${d}>${ops.map(o=>{const[ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${ov==val?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`}
 else if(f.t==='image')c=`<div class="flex flex-col min-[480px]:flex-row gap-3 items-start"><div data-apercu="${id}" class="w-full max-w-[240px] min-[480px]:w-44 aspect-[4/3] shrink-0 border border-dashed border-[#9db4d3] bg-brand-light bg-cover bg-center flex items-center justify-center text-brand/60" style="${val?`background-image:url('${esc(src(val))}');border-style:solid`:''}">${val?'':ic('image','w-8 h-8')}</div><div class="min-w-0 flex-1 w-full"><input type="hidden" id="${id}" name="${nm}" value="${esc(val)}"><input type="file" accept="image/jpeg,image/png,image/webp" class="hidden" data-file="${id}">${d?'':`<div class="flex flex-wrap gap-2"><button type="button" data-a="choisir" data-id="${id}" class="btn btn-o !min-h-[42px]">${ic('upload','w-4 h-4')}<span data-lib="${id}">${val?'Remplacer':'Téléverser'}</span></button><button type="button" data-a="mediaChoisir" data-id="${id}" class="btn btn-o !min-h-[42px]">${ic('image','w-4 h-4')}Médiathèque</button><button type="button" data-a="retirerImg" data-id="${id}" class="btn btn-d !min-h-[42px] ${val?'':'hidden'}" data-retirer="${id}">${ic('trash','w-4 h-4')}Retirer</button></div>`}<p class="text-[11px] text-slate-500 mt-2 leading-relaxed">JPG, PNG ou WebP · 8 Mo maximum · redimensionnée automatiquement (1 600 px).</p></div></div>`;
 else c=`<input class="champ" id="${id}" name="${nm}" type="${f.t==='tel'?'tel':f.t||'text'}" value="${esc(val)}" ${d}${req} ${f.ph?`placeholder="${f.ph}"`:''} ${f.slug?'data-slug':''}>`;
 return `<div class="${sp}">${lab}${c}${aide}</div>`}

function listeHtml(f,arr,ro){
 return `<div class="space-y-2" data-lst="${f.k}">${arr.map((it,i)=>itemHtml(f,it,i,ro)).join('')}</div>${ro?'':`<button type="button" data-a="lstAdd" data-k="${f.k}" class="btn btn-o w-full mt-2">${ic('plus','w-4 h-4')}Ajouter un élément</button>`}`}
function itemHtml(f,it,i,ro){
 const p=f.k+'.'+i+'.',prem=f.champs.find(x=>x.t==='text'||x.t==='textarea')||f.champs[0];
 const image=f.champs.find(x=>x.t==='image'),vign=image&&it[image.k]?`<span class="w-9 h-7 bg-cover bg-center shrink-0 border border-trait" style="background-image:url('${esc(src(it[image.k]))}')"></span>`:`<span class="w-6 h-6 bg-brand-light text-brand text-xs font-bold flex items-center justify-center shrink-0">${i+1}</span>`;
 return `<details class="border border-trait bg-white" data-item ${cur.ouvert===f.k+':'+i?'open':''}><summary class="flex items-center gap-2 pl-3 pr-1 py-1.5 cursor-pointer list-none select-none min-h-[48px]">${vign}<span data-resume class="flex-1 min-w-0 truncate text-sm font-semibold text-brand-dark">${esc(String(it[prem.k]||'').split('\n')[0])||'<span class=\'font-normal text-slate-400\'>(sans titre)</span>'}</span>${ro?'':`<span class="flex shrink-0"><button type="button" data-a="lstMove" data-k="${f.k}" data-i="${i}" data-d="-1" class="w-9 h-9 flex items-center justify-center text-slate-500 disabled:opacity-25" ${i===0?'disabled':''} aria-label="Monter">${ic('haut','w-4 h-4')}</button><button type="button" data-a="lstMove" data-k="${f.k}" data-i="${i}" data-d="1" class="w-9 h-9 flex items-center justify-center text-slate-500 disabled:opacity-25" ${i===(cur.nbListe&&cur.nbListe[f.k]||99)-1?'disabled':''} aria-label="Descendre">${ic('bas','w-4 h-4')}</button><button type="button" data-a="lstDel" data-k="${f.k}" data-i="${i}" class="w-9 h-9 flex items-center justify-center text-red-600" aria-label="Supprimer">${ic('trash','w-4 h-4')}</button></span>`}${ic('edit','w-4 h-4 mr-2 text-slate-400')}</summary><div class="p-3 border-t border-trait grid gap-4 md:grid-cols-2">${f.champs.map(c=>champ(c,it[c.k],ro,p)).join('')}</div></details>`}
function itemsHtml(f,arr,ro){cur.nbListe=cur.nbListe||{};cur.nbListe[f.k]=arr.length;return arr.map((it,i)=>itemHtml(f,it,i,ro)).join('')}

function editeurHtml(champs,vals,ro){
 let out='',ouvert=false;
 const fermer=()=>{if(ouvert){out+='</div></section>';ouvert=false}};
 const ouvrir=t=>{fermer();out+=`<section class="carte p-5"><h3 class="ft font-bold text-brand-dark mb-4">${t}</h3><div class="grid md:grid-cols-2 gap-x-5 gap-y-4">`;ouvert=true};
 champs.forEach(f=>{if(f.g)return ouvrir(f.g);if(!ouvert)ouvrir('Contenu');
  if(f.t==='liste')cur.nbListe=Object.assign(cur.nbListe||{},{[f.k]:(vals[f.k]||[]).length});
  out+=champ(f,vals[f.k],ro||(f.sa&&S.role!=='superadmin'))});
 fermer();return out}

function lireChamps(champs,root,pre=''){
 const o={};champs.forEach(f=>{if(f.g)return;const nm=pre+f.k;
  if(f.t==='liste'){const c=root.querySelector('[data-lst="'+nm+'"]');o[f.k]=c?[...c.children].filter(x=>x.hasAttribute('data-item')).map((_,i)=>lireChamps(f.champs,root,nm+'.'+i+'.')):[]}
  else if(f.t==='lien'){const a=root.elements[nm+'__l'],b=root.elements[nm+'__u'];o[f.k]={l:a?a.value.trim():'',u:b?b.value.trim():''}}
  else{const e=root.elements[nm];if(!e)return;o[f.k]=f.t==='switch'?(e.checked?1:0):f.t==='number'?(e.value===''?0:Number(e.value)):e.value.trim()}});
 return o}

 fermerFeuille();

 vue.innerHTML=html;

 // titre + états actifs

/* ---------- Téléversement d'images (aperçu immédiat, redimensionnement côté navigateur) ---------- */
const TYPES_IMG=['image/jpeg','image/png','image/webp'],MAX_OCTETS=8*1024*1024,COTE_MAX=1600;
function lireImage(file){return new Promise((ok,ko)=>{
 if(!TYPES_IMG.includes(file.type))return ko('« '+file.name+' » : format non accepté (JPG, PNG ou WebP).');
 if(file.size>MAX_OCTETS)return ko('« '+file.name+' » dépasse 8 Mo.');
 const fr=new FileReader();fr.onerror=()=>ko('Lecture impossible.');
 fr.onload=()=>{const im=new Image();im.onerror=()=>ko('« '+file.name+' » n’est pas une image valide.');
  im.onload=()=>{const k=Math.min(1,COTE_MAX/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
   c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85))};im.src=fr.result};fr.readAsDataURL(file)})}

 a.style.backgroundImage=v?`url('${src(v)}')`:'';a.style.borderStyle=v?'solid':'dashed';a.innerHTML=v?'':ic('image','w-8 h-8');
 const l=$(`[data-lib="${id}"]`);if(l)l.textContent=v?'Remplacer l’image':'Choisir une image';const r=$(`[data-retirer="${id}"]`);if(r)r.classList.toggle('hidden',!v)}

 choisir:el=>{const i=$('[data-file="'+el.dataset.id+'"]');if(i)i.click()},
 choisirAlbum:()=>$('#fichiersAlbum').click(),
 retirerImg:el=>{const id=el.dataset.id;$('#'+id).value='';majApercu(id);$('#'+id).dispatchEvent(new Event('input',{bubbles:true}))},
 photoDel:el=>{cur.photos.splice(+el.dataset.i,1);majPhotos()},
 photoMove:el=>{const i=+el.dataset.i,j=i+ +el.dataset.d,P=cur.photos;[P[i],P[j]]=[P[j],P[i]];majPhotos()},
 blocAdd:el=>{cur.blocs.push({type:el.dataset.v,texte:''});majBlocs()},
 blocDel:el=>{cur.blocs.splice(+el.dataset.i,1);majBlocs()},
 blocMove:el=>{const i=+el.dataset.i,j=i+ +el.dataset.d,B=cur.blocs;[B[i],B[j]]=[B[j],B[i]];majBlocs()},
 elemNouveau:()=>formElem(),
 elemEdit:el=>formElem(el.dataset.id),
 elemMove:el=>{const L=D[cur.cle],i=L.findIndex(x=>x.id==el.dataset.id),j=i+ +el.dataset.d;[L[i],L[j]]=[L[j],L[i]];rendre()},
 lstAdd:el=>opListe(el,(a,f)=>{a.push(valeursDefaut(f.champs));cur.ouvert=f.k+':'+(a.length-1)}),
 lstDel:el=>opListe(el,a=>a.splice(+el.dataset.i,1)),
 lstMove:el=>opListe(el,a=>{const i=+el.dataset.i,j=i+ +el.dataset.d;[a[i],a[j]]=[a[j],a[i]];cur.ouvert=el.dataset.k+':'+j}),
 reinit:()=>confirmer('Revenir aux textes d’origine ?','Toutes les modifications de cette section seront remplacées par les textes du site d’origine.','Réinitialiser',()=>{cur.sec.v=valeursDefaut(cur.sec.champs);cur.dirty=false;toast('Section réinitialisée.');rendre()}),
 secMove:el=>{const P=D.pages.find(x=>x.id===el.dataset.p),i=P.sections.findIndex(x=>x.id===el.dataset.s),j=i+ +el.dataset.d;[P.sections[i],P.sections[j]]=[P.sections[j],P.sections[i]];journalise('Modification','Ordre des sections de « '+P.nom+' »');rendre()},
 pageNouvelle:()=>{ouvrirFeuille('Nouvelle page libre',`<form id="fe" class="space-y-4" novalidate>${champ({k:'titre',l:'Titre de la page',req:1},'')}${champ({k:'slug',l:'Adresse (slug)',aide:'Ex. « cgv » donnera /cgv. Générée automatiquement si vide.'},'')}</form>`,`<div class="flex gap-3"><button data-a="fermer" class="btn btn-o flex-1">Annuler</button><button id="eOk" class="btn btn-v flex-1">${ic('check','w-4 h-4')}Créer la page</button></div>`);
  $('#eOk').onclick=()=>{const v=lireChamps([{k:'titre'},{k:'slug'}],$('#fe'));if(!v.titre)return toast('Le titre est obligatoire.','err');const id=v.slug?slugify(v.slug):slugify(v.titre);if(D.pages.some(p=>p.id===id))return toast('Cette adresse existe déjà.','err');
   const sec=Sec('contenu','Contenu de la page',[fT('titre','Titre de la page',v.titre,{span:2}),fTA('texte','Texte','',14,{aide:'Séparez les paragraphes par une ligne vide. **texte** = gras.'})]);sec.v=valeursDefaut(sec.champs);
   D.pages.push({id,nom:v.titre,ico:'lignes',libre:1,url:'/'+id,seo:SEO(v.titre+' — BTP Congo',''),sections:[sec]});journalise('Création','Page libre « '+v.titre+' »');fermerFeuille();toast('Page créée.');location.hash='#/pages/'+id}},
 pageSupprimer:el=>{const P=D.pages.find(x=>x.id===el.dataset.p);confirmer('Supprimer cette page ?','La page « <b>'+esc(P.nom)+'</b> » ne sera plus accessible sur le site.','Supprimer',()=>{D.pages.splice(D.pages.indexOf(P),1);journalise('Suppression','Page libre « '+P.nom+' »');toast('Page supprimée.');location.hash='#/pages'})},
 expMove:el=>{const L=D.expertises,i=L.findIndex(x=>x.id==el.dataset.id),j=i+ +el.dataset.d;[L[i],L[j]]=[L[j],L[i]];rendre()},
 expSuppr:()=>confirmer('Supprimer cette expertise ?','« <b>'+esc(cur.obj.titre)+'</b> » disparaîtra de l’accueil, de la page Expertises et du pied de page.','Supprimer',()=>{D.expertises.splice(D.expertises.indexOf(cur.obj),1);cur.dirty=false;toast('Expertise supprimée.');location.hash='#/expertises'}),
 catNouvelle:()=>formCat(),catEdit:el=>formCat(el.dataset.id),
 catMove:el=>{const L=cur.type==='portfolio'?D.catAlbums:D.catArticles,i=L.findIndex(x=>x.id==el.dataset.id),j=i+ +el.dataset.d;[L[i],L[j]]=[L[j],L[i]];rendre()},
 mediaAjout:()=>$('#fichiersMedia').click(),
 mediaOuvrir:el=>ficheMedia(el.dataset.id),
 mediaChoisir:el=>ouvrirPicker(el.dataset.id),
 pickerOk:el=>{const m=D.medias.find(x=>x.id==el.dataset.mid),i=$('#'+cur.pickerId);i.value=m.src;majApercu(cur.pickerId);i.dispatchEvent(new Event('input',{bubbles:true}));fermerFeuille();toast('Image sélectionnée.')},
 userNouveau:()=>formUser(),userEdit:el=>formUser(el.dataset.id)
};
document.addEventListener('click',e=>{if(e.target.id==='fond'){fermerFeuille();return}
 const el=e.target.closest('[data-a]');if(!el||el.tagName==='INPUT')return;const f=A[el.dataset.a];if(f){if(el.tagName==='A'&&el.dataset.a==='fermer')return fermerFeuille();e.preventDefault();f(el,e)}});
document.addEventListener('change',async e=>{const el=e.target;
 if(el.id==='fichiersMedia'){const fs=[...el.files];el.value='';let n=0;for(const f of fs){try{await versMediatheque(await lireImage(f),f.name);n++}catch(m){toast(m,'err')}}if(n){toast(n+' image'+(n>1?'s ajoutées':' ajoutée')+'.');rendre()}return}
 if(el.dataset&&el.dataset.file){const f=el.files[0];el.value='';if(!f)return;try{const u=await lireImage(f),cible=$('#'+el.dataset.file);cible.value=u;await versMediatheque(u,f.name);majApercu(el.dataset.file);cible.dispatchEvent(new Event('input',{bubbles:true}));toast('Image chargée.')}catch(m){toast(m,'err')}return}
 if(el.id==='fichiersAlbum'){const fs=[...el.files];el.value='';ajouterAlbum(fs);return}if(el.dataset&&el.dataset.a==='secVisible'){const P=D.pages.find(x=>x.id===el.dataset.p),sec=P.sections.find(x=>x.id===el.dataset.s);sec.visible=el.checked?1:0;journalise('Modification','Section « '+sec.nom+' » '+(sec.visible?'affichée':'masquée'));toast(sec.visible?'Section affichée.':'Section masquée.');rendre();return}
 if(el.dataset&&el.dataset.a==='elemActif'){const o=D[cur.cle].find(x=>x.id==el.dataset.id);o.actif=el.checked?1:0;toast(el.checked?'Élément affiché.':'Élément masqué.');rendre()}});
document.addEventListener('input',e=>{const el=e.target;
 if(cur.champs&&el.closest&&el.closest('#form')&&el.name!==undefined){marquerModifie();const d=el.closest('details[data-item]');if(d){const p=d.querySelector('input.champ:not([type=hidden]),textarea.champ'),r=d.querySelector('[data-resume]');if(p&&r&&p===el)r.textContent=el.value.split('\n')[0]||'(sans titre)'}if(cur.vue==='seo')majSeo()}
 if(el.dataset.filtre==='q'){cur.q=el.value.trim().toLowerCase();majListeVue()}
 else if(el.dataset.bloc!==undefined)cur.blocs[+el.dataset.bloc].texte=el.value;
 else if(el.hasAttribute('data-slug')&&cur.neuf!==false){const s=$('#f_slug');if(s&&(!s.dataset.manuel))s.value=slugify(el.value)}
 else if(el.id==='f_slug')el.dataset.manuel=1});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('#zoneDrop'))e.preventDefault()});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#zoneDrop');if(!z)return;e.preventDefault();ajouterAlbum([...e.dataTransfer.files])});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fermerFeuille()});
document.addEventListener('submit',e=>{const f=e.target;if(f.id!=='form')return;e.preventDefault();
 if(cur.champs&&cur.save){const v=lireChamps(cur.champs,f),m=cur.champs.find(x=>x.req&&!x.g&&!v[x.k]);if(m)return toast('Le champ « '+m.l+' » est obligatoire.','err');cur.dirty=false;cur.save(v);const e2=$('#etat');if(e2){e2.textContent='Enregistré à l’instant';e2.className='text-xs font-semibold text-leaf-dark flex-1 min-w-0 truncate'}return}
 const v=cur.vue;
 if(v==='albumFiche'||v==='articleFiche'||v==='offreFiche'){
  const fs=v==='albumFiche'?F_ALBUM:v==='articleFiche'?F_ART:F_OFFRE,o=lireForm(f,fs),miss=fs.find(x=>x.req&&!o[x.k]);
  if(miss)return toast('Le champ « '+miss.l+' » est obligatoire.','err');
  if(!o.slug)o.slug=slugify(o.titre);
  const L=D[v==='albumFiche'?'albums':v==='articleFiche'?'articles':'offres'];
  if(v==='albumFiche'){if(o.publie&&!cur.photos.length)return toast('Ajoutez au moins une photo pour publier.','err');o.photos=cur.photos}
  if(v==='articleFiche')o.blocs=cur.blocs.filter(b=>b.texte.trim());
  if(cur.neuf)L.push({id:prochain(L),...o});else Object.assign(cur.obj,o);
  journalise(cur.neuf?'Création':'Modification','« '+o.titre+' »');toast('Enregistré avec succès.');location.hash={albumFiche:'#/portfolio',articleFiche:'#/actualites',offreFiche:'#/emplois'}[v]}
 else if(v==='param'){D.parametres.forEach(g=>g.items.forEach(p=>{const el=f.elements[p.cle];if(el)p.v=el.value.trim()}));journalise('Paramètres','Paramètres du site mis à jour');toast('Paramètres enregistrés.');rendre()}
 else if(v==='profil'){const n=f.elements.nouveau.value;if(!f.elements.actuel.value)return toast('Saisissez votre mot de passe actuel.','err');if(n.length<10)return toast('Nouveau mot de passe : 10 caractères minimum.','err');if(n!==f.elements.confirmation.value)return toast('La confirmation ne correspond pas.','err');f.reset();toast('Mot de passe mis à jour.')}});

window.__ADM={D:D,get cur(){return cur}};
demarrer();
})();
</script>
