.sw span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;background:#fff;transition:.2s}

function ouvrirFeuille(titre,corps,pied=''){
 fermerFeuille();
 $('#calques').innerHTML=`<div id="fond" class="fixed inset-0 z-[60] bg-[#0C2747]/55 flex items-end md:items-center justify-center md:p-6" style="animation:ap .15s both">

  <div class="overflow-y-auto p-5 flex-1">${corps}</div>${pied?`<div class="p-4 border-t border-trait shrink-0 bnav">${pied}</div>`:''}
 </div></div>`;document.body.style.overflow='hidden'}

 $('#ok').onclick=()=>{fermerFeuille();fn()}}

function champ(f,v,ro){
 const d=ro?'disabled':'',id='f_'+f.k,val=v??'',req=f.req?' required':'';
 const l=`<label class="lbl" for="${id}">${f.l}${f.req?' <span class="text-red-600">*</span>':''}</label>`;
 let c;
 if(f.t==='textarea')c=`<textarea class="champ" id="${id}" name="${f.k}" ${d}${req} ${f.rows?`style="min-height:${f.rows*26}px"`:''}>${esc(val)}</textarea>`;

  <p class="text-[11px] text-slate-400 text-center mt-6">Accès réservé au personnel autorisé · Toute connexion est journalisée.</p></div></div></div>`;
 $('#fc').addEventListener('submit',e=>{e.preventDefault();const em=$('#f_email').value.trim(),m=$('#f_mdp').value,er=$('#errC');

const ROUTES=[
 [/^\/tableau-de-bord$/,()=>V.dash(),'dash',1,'Tableau de bord'],
 [/^\/devis$/,()=>V.devis(),'devis',1,'Demandes de devis'],
 [/^\/devis\/(\d+)$/,m=>V.devisFiche(m[1]),'devis',1,'Fiche devis'],
 [/^\/candidatures$/,()=>V.cand(),'cand',1,'Candidatures'],
 [/^\/candidatures\/(\d+)$/,m=>V.candFiche(m[1]),'cand',1,'Fiche candidature'],
 [/^\/portfolio$/,()=>V.portfolio(),'portfolio',1,'Portfolio'],
 [/^\/portfolio\/(\d+|nouveau)$/,m=>V.albumFiche(m[1]),'portfolio',1,'Album'],
 [/^\/actualites$/,()=>V.actu(),'actu',1,'Actualités'],
 [/^\/actualites\/(\d+|nouveau)$/,m=>V.articleFiche(m[1]),'actu',1,'Article'],
 [/^\/emplois$/,()=>V.emplois(),'emplois',1,'Offres d’emploi'],
 [/^\/emplois\/(\d+|nouveau)$/,m=>V.offreFiche(m[1]),'emplois',1,'Offre d’emploi'],
 [/^\/contenu(?:\/([a-z]+))?$/,m=>V.contenu(m[1]),'contenu',1,'Pages du site'],

let derniereRoute='';
function chemin(){const h=location.hash.slice(1);if(h)return h;let l='';try{l=localStorage.getItem('btp_admin_route')||''}catch(e){}return l||'/tableau-de-bord'}
function rendre(){
 if(!S.connecte)return;
 const ch=chemin();if(!location.hash)history.replaceState(null,'','#'+ch);
 fermerFeuille();
 let r=null,m=null;for(const x of ROUTES){m=ch.match(x[0]);if(m){r=x;break}}
 const vue=$('#vue');
 let html,nav='',titre='Page introuvable';
 if(!r)html=introuvable();else{nav=r[2];titre=r[4];html=niveau()<r[3]?refuse():r[1](m)}
 vue.innerHTML=html;
 if(r){const fn=V[{dash:'dash',devis:/\/devis\/\d/.test(ch)?'devisFiche':'devis',cand:/\/candidatures\/\d/.test(ch)?'candFiche':'cand',portfolio:/\/portfolio\/./.test(ch)?'albumFiche':'portfolio',actu:/\/actualites\/./.test(ch)?'articleFiche':'actu',emplois:/\/emplois\/./.test(ch)?'offreFiche':'emplois',contenu:'contenu',param:'param',users:'users',journal:'journal',profil:'profil'}[r[2]]];if(fn&&fn.after&&niveau()>=r[3])fn.after()}
 // titre + états actifs
 const t=$('#titrePage');if(t)t.textContent=/nouveau$/.test(ch)?titre+' — création':titre;
 document.title=titre+' · Administration BTP Congo';
 $$('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===nav));
 $$('[data-bn]').forEach(b=>{const k=b.dataset.bn;b.classList.toggle('on',k===nav||(k==='contenu'&&GROUPE_CONTENU.includes(nav))||(k==='plus'&&GROUPE_PLUS.includes(nav)))});
 $$('[data-badge]').forEach(b=>{const n=badge(b.dataset.badge);b.textContent=n;if(b.tagName==='B')b.classList.toggle('hidden',!n)});
 try{localStorage.setItem('btp_admin_route',ch)}catch(e){}
 if(ch!==derniereRoute)window.scrollTo({top:0});derniereRoute=ch;
}
function demarrer(){
 if(!S.connecte){vueConnexion();return}
 $('#app').innerHTML=coque();rendre()}
window.addEventListener('hashchange',()=>{if(S.connecte)rendre()});

/* ---------- Actions (délégation) ---------- */
function majListeVue(){const l=$('#liste');if(l&&cur.liste)l.innerHTML=cur.liste()}
/* ---------- Téléversement d'images (aperçu immédiat, redimensionnement côté navigateur) ---------- */
const TYPES_IMG=['image/jpeg','image/png','image/webp'],MAX_OCTETS=8*1024*1024,COTE_MAX=1600;
function lireImage(file){return new Promise((ok,ko)=>{
 if(!TYPES_IMG.includes(file.type))return ko('« '+file.name+' » : format non accepté (JPG, PNG ou WebP).');
 if(file.size>MAX_OCTETS)return ko('« '+file.name+' » dépasse 8 Mo.');
 const fr=new FileReader();fr.onerror=()=>ko('Lecture impossible.');
 fr.onload=()=>{const im=new Image();im.onerror=()=>ko('« '+file.name+' » n’est pas une image valide.');
  im.onload=()=>{const k=Math.min(1,COTE_MAX/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
   c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85))};im.src=fr.result};fr.readAsDataURL(file)})}
function majApercu(id){const v=$('#'+id).value,a=$(`[data-apercu="${id}"]`);if(!a)return;
 a.style.backgroundImage=v?`url('${src(v)}')`:'';a.style.borderStyle=v?'solid':'dashed';a.innerHTML=v?'':ic('image','w-8 h-8');
 const l=$(`[data-lib="${id}"]`);if(l)l.textContent=v?'Remplacer l’image':'Choisir une image';const r=$(`[data-retirer="${id}"]`);if(r)r.classList.toggle('hidden',!v)}
async function ajouterAlbum(files){let n=0;for(const f of files){try{cur.photos.push(await lireImage(f));n++}catch(m){toast(m,'err')}}if(n){majPhotos();toast(n+' photo'+(n>1?'s ajoutées':' ajoutée')+'.')}}

const A={
 fermer:()=>fermerFeuille(),

 role:el=>{S.role=el.dataset.v;sauve();$('#app').innerHTML=coque();if(niveau()<(ROUTES.find(r=>r[0].test(chemin()))||[0,0,0,1])[3])location.hash='#/tableau-de-bord';rendre();toast('Rôle simulé : '+ROLES[S.role][0])},
 voirMdp:el=>{const i=$('#f_mdp');i.type=i.type==='password'?'text':'password'},
 menuContenu:()=>menuLiens(GROUPE_CONTENU,'Contenu du site'),
 menuPlus:()=>menuLiens(['param','users','journal'],'Plus'),
 filtre:el=>{cur.filtre=el.dataset.v;$$('[data-a=filtre]').forEach(b=>b.classList.toggle('on',b===el));majListeVue()},
 statut:el=>{const L=el.dataset.t==='devis'?D.devis:D.candidatures,o=L.find(x=>x.id==el.dataset.id);o.statut=el.dataset.v;journalise('Traitement',(el.dataset.t==='devis'?'Devis':'Candidature')+' n° '+o.id+' passé « '+(el.dataset.t==='devis'?STAT.devis:STAT.cand)[o.statut][0].toLowerCase()+' »');toast('Statut mis à jour.');rendre()},
 note:el=>{const L=el.dataset.t==='devis'?D.devis:D.candidatures,o=L.find(x=>x.id==el.dataset.id);o.note_interne=$('#note').value.trim();toast('Note enregistrée.')},
 cv:()=>toast('Téléchargement du CV (fonction serveur à venir).'),
 supprimer:el=>{const t=el.dataset.t,L=t==='devis'?D.devis:D.candidatures,o=L.find(x=>x.id==el.dataset.id);
  confirmer('Supprimer définitivement ?','Cette action est irréversible. '+(t==='devis'?'La demande de <b>'+esc(o.nom_complet)+'</b>':'La candidature de <b>'+esc(o.nom_complet)+'</b> et son CV')+' seront supprimés.','Supprimer',()=>{L.splice(L.indexOf(o),1);journalise('Suppression',(t==='devis'?'Devis':'Candidature')+' n° '+o.id);toast('Élément supprimé.');location.hash=t==='devis'?'#/devis':'#/candidatures'})},
 supprimerObjet:el=>{const t=el.dataset.t,o=cur.obj;confirmer('Supprimer définitivement ?','« <b>'+esc(o.titre)+'</b> » sera supprimé du site. Cette action est irréversible.','Supprimer',()=>{D[t].splice(D[t].indexOf(o),1);journalise('Suppression','« '+o.titre+' »');toast('Élément supprimé.');location.hash={albums:'#/portfolio',articles:'#/actualites',offres:'#/emplois'}[t]})},
 choisir:el=>{const i=$('[data-file="'+el.dataset.id+'"]');if(i)i.click()},
 choisirAlbum:()=>$('#fichiersAlbum').click(),
 retirerImg:el=>{const id=el.dataset.id;$('#'+id).value='';majApercu(id)},
 photoDel:el=>{cur.photos.splice(+el.dataset.i,1);majPhotos()},
 photoMove:el=>{const i=+el.dataset.i,j=i+ +el.dataset.d,P=cur.photos;[P[i],P[j]]=[P[j],P[i]];majPhotos()},
 blocAdd:el=>{cur.blocs.push({type:el.dataset.v,texte:''});majBlocs()},
 blocDel:el=>{cur.blocs.splice(+el.dataset.i,1);majBlocs()},
 blocMove:el=>{const i=+el.dataset.i,j=i+ +el.dataset.d,B=cur.blocs;[B[i],B[j]]=[B[j],B[i]];majBlocs()},
 elemNouveau:()=>formElem(),
 elemEdit:el=>formElem(el.dataset.id),
 elemMove:el=>{const L=D.contenu[cur.onglet],i=L.findIndex(x=>x.id==el.dataset.id),j=i+ +el.dataset.d;[L[i],L[j]]=[L[j],L[i]];rendre()},
 userNouveau:()=>formUser(),userEdit:el=>formUser(el.dataset.id)
};
function formElem(id){const C=CT[cur.onglet],L=D.contenu[cur.onglet],o=id?L.find(x=>x.id==id):{actif:1};
 ouvrirFeuille(id?'Modifier l’élément':'Nouvel élément',`<form id="fe" class="space-y-4" novalidate>${C.fs.map(f=>champ(f,o[f.k],!peutEditer())).join('')}</form>`,
 `<div class="flex gap-3">${id&&peutSupprimer()?`<button id="eDel" class="btn btn-d">${ic('trash','w-4 h-4')}</button>`:''}<button data-a="fermer" class="btn btn-o flex-1">Annuler</button><button id="eOk" class="btn btn-v flex-1">${ic('check','w-4 h-4')}Enregistrer</button></div>`);
 $('#eOk').onclick=()=>{const v=lireForm($('#fe'),C.fs);const m=C.fs.find(f=>f.req&&!v[f.k]);if(m)return toast('Le champ « '+m.l+' » est obligatoire.','err');
  if(id)Object.assign(o,v);else L.push({id:prochain(L),...v});journalise('Modification','Contenu « '+C.l+' »');fermerFeuille();toast('Élément enregistré.');rendre()};
 const d=$('#eDel');if(d)d.onclick=()=>confirmer('Supprimer cet élément ?','Il sera retiré de la page du site.','Supprimer',()=>{L.splice(L.indexOf(o),1);toast('Élément supprimé.');rendre()})}
document.addEventListener('click',e=>{if(e.target.id==='fond'){fermerFeuille();return}
 const el=e.target.closest('[data-a]');if(!el||el.tagName==='INPUT')return;const f=A[el.dataset.a];if(f){if(el.tagName==='A'&&el.dataset.a==='fermer')return fermerFeuille();e.preventDefault();f(el,e)}});
document.addEventListener('change',async e=>{const el=e.target;
 if(el.dataset&&el.dataset.file){const f=el.files[0];el.value='';if(!f)return;try{$('#'+el.dataset.file).value=await lireImage(f);majApercu(el.dataset.file);toast('Image chargée.')}catch(m){toast(m,'err')}return}
 if(el.id==='fichiersAlbum'){const fs=[...el.files];el.value='';ajouterAlbum(fs);return}if(el.dataset&&el.dataset.a==='elemActif'){const o=D.contenu[cur.onglet].find(x=>x.id==el.dataset.id);o.actif=el.checked?1:0;toast(el.checked?'Élément affiché.':'Élément masqué.');rendre()}});
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.filtre==='q'){cur.q=el.value.trim().toLowerCase();majListeVue()}
 else if(el.dataset.bloc!==undefined)cur.blocs[+el.dataset.bloc].texte=el.value;
 else if(el.hasAttribute('data-slug')&&cur.neuf!==false){const s=$('#f_slug');if(s&&(!s.dataset.manuel))s.value=slugify(el.value)}
 else if(el.id==='f_slug')el.dataset.manuel=1});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('#zoneDrop'))e.preventDefault()});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#zoneDrop');if(!z)return;e.preventDefault();ajouterAlbum([...e.dataTransfer.files])});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fermerFeuille()});
document.addEventListener('submit',e=>{const f=e.target;if(f.id!=='form')return;e.preventDefault();
 const v=cur.vue;
 if(v==='albumFiche'||v==='articleFiche'||v==='offreFiche'){
  const fs=v==='albumFiche'?F_ALBUM:v==='articleFiche'?F_ART:F_OFFRE,o=lireForm(f,fs),miss=fs.find(x=>x.req&&!o[x.k]);
  if(miss)return toast('Le champ « '+miss.l+' » est obligatoire.','err');
  if(!o.slug)o.slug=slugify(o.titre);
  const L=D[v==='albumFiche'?'albums':v==='articleFiche'?'articles':'offres'];
  if(v==='albumFiche'){if(o.publie&&!cur.photos.length)return toast('Ajoutez au moins une photo pour publier.','err');o.photos=cur.photos}
  if(v==='articleFiche')o.blocs=cur.blocs.filter(b=>b.texte.trim());
  if(cur.neuf)L.push({id:prochain(L),...o});else Object.assign(cur.obj,o);
  journalise(cur.neuf?'Création':'Modification','« '+o.titre+' »');toast('Enregistré avec succès.');location.hash={albumFiche:'#/portfolio',articleFiche:'#/actualites',offreFiche:'#/emplois'}[v]}
 else if(v==='param'){D.parametres.forEach(g=>g.items.forEach(p=>{const el=f.elements[p.cle];if(el)p.v=el.value.trim()}));journalise('Paramètres','Paramètres du site mis à jour');toast('Paramètres enregistrés.');rendre()}
 else if(v==='profil'){const n=f.elements.nouveau.value;if(!f.elements.actuel.value)return toast('Saisissez votre mot de passe actuel.','err');if(n.length<10)return toast('Nouveau mot de passe : 10 caractères minimum.','err');if(n!==f.elements.confirmation.value)return toast('La confirmation ne correspond pas.','err');f.reset();toast('Mot de passe mis à jour.')}});

demarrer();
</script>
</body>
</html>
